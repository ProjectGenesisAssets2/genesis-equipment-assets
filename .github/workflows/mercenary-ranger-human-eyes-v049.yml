name: Genesis | V049 authentic 65-bone Ranger less-waxy skin, human eyes and eyebrows Cycles32
on:
  push:
    branches: [experiment/mercenary-ranger-adult-material-eyes-v049-20261107]
    paths:
      - scripts/mercenary/correct_quaternius_ranger_adult_face_v049.py
      - .github/workflows/mercenary-ranger-human-eyes-v049.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-adult-eyes-and-skin:
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - name: Restore approved-as-base only V045b authentic original Quaternius Ranger, verify immutable input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/genesis_v049 output/mercenary_eyes_skin_v049
          curl -fSL --retry 3 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ProjectGenesisAssets2/genesis-equipment-assets/actions/artifacts/13599181223/zip' \
            -o /tmp/genesis_v049/ranger_source.zip
          unzip -oq /tmp/genesis_v049/ranger_source.zip -d /tmp/genesis_v049
          echo 'fc1baff512c38a59660f7240b0da9e4a2bd19d038ccd055357b3635572fed7b4  /tmp/genesis_v049/GENESIS_QUATERNIUS_RANGER_MALE_FACE_PBR_V045B.glb' | sha256sum -c
      - name: Real EXR 4K, 32bit per channel, match comparative lighting exactly
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 240 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' \
            -o /tmp/genesis_v049/studio_small_09_4k.exr
          echo 'bbb83755cf731a87373bdd25e28b4a74f58c8c8a02bf348e960635265ffda558  /tmp/genesis_v049/studio_small_09_4k.exr' | sha256sum -c
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 360 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' \
            -o /tmp/genesis_v049/blender.tar.xz
          mkdir -p /tmp/genesis_v049/blender
          tar -xJf /tmp/genesis_v049/blender.tar.xz \
            -C /tmp/genesis_v049/blender --strip-components=1
          /tmp/genesis_v049/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Render genuine V049 Quaternius human eyes face and PBR skin with Cycles, export test GLB
        run: |
          set -euo pipefail
          /tmp/genesis_v049/blender/blender -b -t 4 --python-exit-code 1 \
            --python scripts/mercenary/correct_quaternius_ranger_adult_face_v049.py -- \
            --source /tmp/genesis_v049/GENESIS_QUATERNIUS_RANGER_MALE_FACE_PBR_V045B.glb \
            --hdri /tmp/genesis_v049/studio_small_09_4k.exr \
            --out output/mercenary_eyes_skin_v049
      - name: Real glTF and source unchanged audit, no main publishing or human approval claims
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          d=Path('output/mercenary_eyes_skin_v049')
          p=d/'GENESIS_QUATERNIUS_RANGER_HUMAN_EYES_MATTE_SKIN_V049.glb'
          raw=p.read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<II',raw,4)==(2,len(raw))
          n,t=struct.unpack_from('<I4s',raw,12);assert t==b'JSON'
          g=json.loads(raw[20:20+n])
          assert len(g['skins'])==1 and len(g['skins'][0]['joints'])==65
          names=[g['nodes'][i].get('name','') for i in g['skins'][0]['joints']]
          assert sum('thumb' in x and x.endswith('_r') for x in names)>=3
          assert sum('thumb' in x and x.endswith('_l') for x in names)>=3
          report=json.loads((d/'V049_REAL_HUMAN_EYES_SKIN_QA.json').read_text())
          assert report['native_3D_irises_pupils_added']==6
          assert len(report['renders'])==3 and len(list(d.glob('V049_*.png')))==3
          assert hashlib.sha256(raw).hexdigest()==report['output_glb_sha256']
          assert report['user_approved'] is False and report['main_modified'] is False
          print('V049_TRUE_FACE_PBR_TECHNICAL_QA_PASS_RENDER_REVIEW_PENDING')
          PY
      - name: Save experimental GLB plus 3 authentic Cycles EXR32 visual tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V049-Ranger-Adult-Face-Eyes-PBR-Cycles32-Experimental
          path: output/mercenary_eyes_skin_v049/
          retention-days: 10
          if-no-files-found: warn
