name: Genesis original provisional sword GLB for PlayCanvas
on:
  push:
    branches: ['feature/genesis-sword-provisional-webgl-20261103']
    paths:
      - 'scripts/create_provisional_sword.py'
      - '.github/workflows/build-provisional-sword.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 240 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Generate original sword GLB
        run: |
          set -euo pipefail
          /tmp/blender/blender -b --factory-startup -t 2 --python-exit-code 1 --python scripts/create_provisional_sword.py
          python3 - <<'PY'
          import json,pathlib,hashlib
          base=pathlib.Path('assets/playcanvas/swords/provisional_v001')
          a=json.loads((base/'audit.json').read_text())
          p=base/'genesis_sword_provisional_v001.glb'
          assert p.read_bytes()[:4]==b'glTF'
          assert a['blade_present'] and a['fab_asset_used'] is False
          assert a['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          print('PROVISIONAL_SWORD_VALIDATED',a['bytes'],a['sha256'])
          PY
      - name: Publish generated asset on feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/playcanvas/swords/provisional_v001/
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish generated original sword GLB provisional V001"
            git push origin HEAD:feature/genesis-sword-provisional-webgl-20261103
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: genesis-provisional-sword-v001-glb
          path: assets/playcanvas/swords/provisional_v001/
          retention-days: 14
          if-no-files-found: error
