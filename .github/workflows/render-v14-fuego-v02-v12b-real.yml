name: Genesis V14 - Fuego V02 sobre espada REAL V175 V12B · Cycles EXR32
on:
  push:
    branches: [experiment/v14-fuego-v02-blade-attached-20261105]
    paths:
      - 'scripts/fab_sword/render_v14_v12b_fuego_v02_cycles.py'
      - 'presets/approved/Genesis_Espada_V03_Hierro_V175_V12B.json'
      - '.github/workflows/render-v14-fuego-v02-v12b-real.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-v14-fuego-v02
  cancel-in-progress: true
jobs:
  cycles-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate EXACT existing 21 MB V03 V175 GLB from saved Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-original-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-original-v03.glb' | sha256sum -c
      - name: Recover exact 4096x2048 RGB 32-bit/channel HDRI Studio Small 09 EXR
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --connect-timeout 25 --max-time 240 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' -o /tmp/studio_small_09_4k.exr
          echo 'bbb83755cf731a87373bdd25e28b4a74f58c8c8a02bf348e960635265ffda558  /tmp/studio_small_09_4k.exr' | sha256sum -c
          test "$(stat -c %s /tmp/studio_small_09_4k.exr)" -gt 1000000
      - name: Install Blender Foundation official 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 240 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender-4.5.13.tar.xz
          test "$(stat -c %s /tmp/blender-4.5.13.tar.xz)" -gt 300000000
          mkdir -p /tmp/genesis-blender
          tar -xJf /tmp/blender-4.5.13.tar.xz -C /tmp/genesis-blender --strip-components=1
          /tmp/genesis-blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Render actual original V12B sword with independent 0 60 100 intensity Fire VFX
        run: |
          set -euo pipefail
          mkdir -p /tmp/genesis-v14
          /tmp/genesis-blender/blender -b -t 4 --factory-startup --python-exit-code 1 --python scripts/fab_sword/render_v14_v12b_fuego_v02_cycles.py -- --input /tmp/genesis-original-v03.glb --hdri /tmp/studio_small_09_4k.exr --output-dir /tmp/genesis-v14 --preset presets/approved/Genesis_Espada_V03_Hierro_V175_V12B.json --samples 96
          test -s /tmp/genesis-v14/V03_Blender_Cycles_HDRI32_Hero.png
          test -s /tmp/genesis-v14/V03_Blender_Cycles_HDRI32_TresCuartos.png
          test -s /tmp/genesis-v14/V03_V175_HDRI32_Detalle_Filo.png
          test -s /tmp/genesis-v14/render_audit.json
          test -s /tmp/genesis-v14/lighting_profile.json
          for f in Fuego_V02_060_V12B_Hero Fuego_V02_060_V12B_Detalle_Filo Fuego_V02_100_V12B_Hero; do
            test -s "/tmp/genesis-v14/${f}.png"
          done
          test -s /tmp/genesis-v14/fuego_v02_real_v12b_audit.json
      - name: Validate exact V175 material, 96-bit/channel total RGB HDRI, source identity and camera proof
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          p=pathlib.Path('/tmp/genesis-v14')
          a=json.loads((p/'render_audit.json').read_text())
          light=json.loads((p/'lighting_profile.json').read_text())
          assert a['source_sha256']=='e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b'
          assert a['hdri_sha256']=='bbb83755cf731a87373bdd25e28b4a74f58c8c8a02bf348e960635265ffda558'
          assert a['hdri_image_depth_bpp']==96
          assert a['hdri_dimensions']==[4096,2048]
          assert a['geometry_triangles']==2150 and not a['geometry_or_material_edit']
          assert a['renderer']=='Cycles' and a['blender'].startswith('4.5.13')
          assert any('Iron_Blade_V175' in m for m in a['original_materials'])
          assert len(a['renders'])==3 and a['effects_present'] is False
          assert light['hdri']['bits_per_channel']==32 and light['visual_approval']=='pending'
          for r in a['renders']:
            data=(p/r['file']).read_bytes()
            assert len(data)>70000 and data[:8]==b'\x89PNG\r\n\x1a\n'
            width,height=struct.unpack_from('>II',data,16)
            assert (width,height)==(1200,1500)
          b=json.loads((p/'fuego_v02_real_v12b_audit.json').read_text())
          preset=json.loads(pathlib.Path('presets/approved/Genesis_Espada_V03_Hierro_V175_V12B.json').read_text())
          assert preset['visual_status']=='approved_by_user'
          assert b['original_sword_GLBSHA256']==a['source_sha256']
          assert b['blade_triangles']==98 and b['full_sword_triangles']==2150
          assert b['actual_blade_surface_sampled']['blade_sampled_sections']>120
          assert b['original_GLB_geometry_modified'] is False
          assert b['original_PBR_blade_color_modified'] is False
          assert b['roughness_multiplier_V12B']==.34 and b['oxide_roughness_V12B']==.10
          assert b['hdri_rgb_bits_per_channel']==32 and b['hdri_sha256']==preset['lighting']['hdri_sha256']
          assert b['concept_or_imagegen_used'] is False
          assert len(b['rendered_files'])==4 and len(b['fire_segments'])==3
          assert [x['intensity'] for x in b['rendered_files']]==[0,60,60,100]
          for item in b['rendered_files']:
            data=(p/item['file']).read_bytes()
            assert len(data)>70000 and data[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack_from('>II',data,16)==(1200,1500)
          print('GENESIS_V14_FUEGO_V02_REAL_V12B_VERIFIED',b['actual_blade_surface_sampled'])
          PY
      - name: Derive compact mobile review previews FROM Cycles PNG, never from HDRI
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          for file in V12_V175_Color_J_Rugosidad034_Hero Fuego_V02_060_V12B_Hero Fuego_V02_060_V12B_Detalle_Filo Fuego_V02_100_V12B_Hero; do
            ffmpeg -y -loglevel error -i "/tmp/genesis-v14/${file}.png" -vf 'scale=600:750:flags=lanczos' -frames:v 1 -q:v 4 "/tmp/genesis-v14/${file}_preview.jpg"
            test "$(stat -c %s "/tmp/genesis-v14/${file}_preview.jpg")" -gt 10000
          done
      - name: Stage rendered PNG and JSON ONLY - no original model or EXR released
        run: |
          set -euo pipefail
          mkdir -p public-previews/espada-v03-v175-v12b-fuego-v02-v14
          cp /tmp/genesis-v14/V12_V175_Color_J_Rugosidad034_Hero.png public-previews/espada-v03-v175-v12b-fuego-v02-v14/
          cp /tmp/genesis-v14/Fuego_*.png public-previews/espada-v03-v175-v12b-fuego-v02-v14/
          cp /tmp/genesis-v14/*_preview.jpg public-previews/espada-v03-v175-v12b-fuego-v02-v14/
          cp /tmp/genesis-v14/fuego_v02_real_v12b_audit.json public-previews/espada-v03-v175-v12b-fuego-v02-v14/

          test "$(find public-previews/espada-v03-v175-v12b-fuego-v02-v14 -name '*.png' | wc -l)" -eq 4
          ! find public-previews/espada-v03-v175-v12b-fuego-v02-v14 -type f \( -iname '*.glb' -o -iname '*.exr' -o -iname '*.blend' \) | grep -q .
      - name: Publish experimental master render for visual review (not main)
        run: |
          git config user.name 'Genesis Studio Preview CI'
          git config user.email '41898282+genesis-preview[bot]@users.noreply.github.com'
          git add public-previews/espada-v03-v175-v12b-fuego-v02-v14/
          if git diff --cached --quiet; then
            echo 'Gallery already published'
          else
            git commit -m 'preview(v14): exact V12B sword with rooted flame V02, saturated red embers, no fake orange light blobs; Cycles HDRI32'
            git fetch origin experiment/v14-fuego-v02-blade-attached-20261105
            git rebase FETCH_HEAD
            git push origin HEAD:experiment/v14-fuego-v02-blade-attached-20261105
          fi
      - name: Remove temporary original licensed model and HDRI from runner
        if: always()
        run: |
          rm -f /tmp/genesis-original-v03.glb /tmp/studio_small_09_4k.exr
