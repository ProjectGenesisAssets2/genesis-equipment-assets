name: Genesis V19 - Fuego V18 halo fino animado + Rayo V07 approved WebGL
on:
  pull_request:
    types: [opened, reopened]
    branches: [experiment/v18-fuego-halo-60pct-mas-fino-v12b-20261105]
  workflow_dispatch:
concurrency:
  group: genesis-v19-fire-ray-animation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  real-webgl-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Assert V07 approved GLSL remains unchanged
        run: python3 tests/fire-ray-v19/check_rayo_approved.py
      - name: Recover exact original V03 GLB locally and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-original-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-original-v03.glb' | sha256sum -c
          cp /tmp/genesis-original-v03.glb tests/fire-ray-v19/source_original_v03.glb
      - name: Install official PlayCanvas, Chromium and ffmpeg
        run: |
          npm install --no-audit --no-fund --no-save playcanvas@2.23.3 playwright@1.56.1 pngjs@7.0.0
          test -s node_modules/playcanvas/build/playcanvas.mjs
          npx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -y && sudo apt-get install -y ffmpeg; fi
      - name: Serve original sword and modular VFX
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/genesis-v08-http.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/tests/fire-ray-v19/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/tests/fire-ray-v19/source_original_v03.glb)" = 200
      - name: Render five fire-only and fire-ray samples in real PlayCanvas WebGL2
        run: |
          set -o pipefail
          node tests/fire-ray-v19/record.cjs | tee /tmp/genesis-v08-browser.log
          test "$(find fire-ray-v19-output -maxdepth 1 -name '*_frame_*.png' | wc -l)" -eq 144
          test -s fire-ray-v19-output/audit.json
          test -s fire-ray-v19-output/Proof_Fuego_060.png
          test -s fire-ray-v19-output/Proof_Fuego060_Rayo060.png
      - name: Encode videos and GIFs from real captured frames
        run: |
          set -e
          cd fire-ray-v19-output
          for mode in Fuego_060 Fuego_100 Rayo_060 Fuego060_Rayo060 Fuego025_Rayo080 Fuego080_Rayo025; do
            ffmpeg -y -loglevel error -framerate 12 -i "$mode"_frame_%03d.png -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -movflags +faststart "$mode".mp4
            test -s "$mode".mp4
          done
          for mode in Fuego060_Rayo060 Fuego025_Rayo080 Fuego080_Rayo025; do
            ffmpeg -y -loglevel error -i "$mode".mp4 -vf 'fps=10,scale=960:-1:flags=lanczos,palettegen' "$mode"_palette.png
            ffmpeg -y -loglevel error -i "$mode".mp4 -i "$mode"_palette.png -lavfi 'fps=10,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3' -loop 0 "$mode".gif
            test -s "$mode".gif
          done
      - name: Publish experiment previews only; never original licensed GLB
        run: |
          set -e
          mkdir -p public-previews/fuego-rayo-v19
          cp fire-ray-v19-output/*.mp4 public-previews/fuego-rayo-v19/
          cp fire-ray-v19-output/*.gif public-previews/fuego-rayo-v19/
          cp fire-ray-v19-output/Proof_*.png public-previews/fuego-rayo-v19/
          cp fire-ray-v19-output/audit.json public-previews/fuego-rayo-v19/
          ! find public-previews/fuego-rayo-v19 -type f -iname '*.glb' | grep -q .
      - name: Attach experimental renders for user review
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V19-FuegoV18-RayoV07-Animated-Experimental
          path: public-previews/fuego-rayo-v19/
          retention-days: 7
      - name: Commit experiment previews only, not main
        run: |
          git config user.name 'Genesis Preview CI'
          git config user.email '41898282+genesis-preview[bot]@users.noreply.github.com'
          git fetch origin experiment/v19-animacion-fuego-v18-rayo-v07-20261106
          git checkout -B experiment/v19-animacion-fuego-v18-rayo-v07-20261106 FETCH_HEAD
          git add public-previews/fuego-rayo-v19/
          if git diff --cached --quiet; then echo 'Already current'; else
            git commit -m 'preview(v19): dual-channel animated flame V18 + approved lightning V07'
            git push origin HEAD:experiment/v19-animacion-fuego-v18-rayo-v07-20261106
          fi
      - name: Cleanup original licensed GLB
        if: always()
        run: rm -f /tmp/genesis-original-v03.glb tests/fire-ray-v19/source_original_v03.glb
