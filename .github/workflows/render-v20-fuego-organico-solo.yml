name: Genesis V20 - Fuego orgánico individual, halo fino, WebGL2 real
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [experiment/v19-animacion-fuego-v18-rayo-v07-20261106]
  workflow_dispatch:
concurrency:
  group: genesis-v20-standalone-organic-fire
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  standalone-fire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify source scripts and seven-affinity mapping contract
        run: |
          node --check vfx/experimental/Genesis_Fuego_V20_Organico.mjs
          node --check tests/fuego-v20/scene.js
          node --check tests/fuego-v20/record.cjs
          node tests/affinity-slots-v01/validate.mjs
          python3 tests/fire-rayo-v08/check_rayo_approved.py
      - name: Restore unchanged original GLB V03 V175 (temporary only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-v20-original.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-v20-original.glb' | sha256sum -c
          cp /tmp/genesis-v20-original.glb tests/fuego-v20/source_original_v03.glb
      - name: Install PlayCanvas and Chromium headless shell
        timeout-minutes: 5
        run: |
          timeout 180s npm install --no-audit --no-fund --no-save playcanvas@2.23.3 playwright@1.56.1 pngjs@7.0.0
          timeout 120s npx playwright install chromium --only-shell
      - name: Install stand-alone ffmpeg binary (avoid apt-get dependency)
        timeout-minutes: 3
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null; then
            python3 -m venv /tmp/genesis-ffmpeg-venv
            /tmp/genesis-ffmpeg-venv/bin/pip install --disable-pip-version-check --quiet imageio-ffmpeg==0.6.0
            mkdir -p /tmp/genesis-ffmpeg-bin
            ln -s "$(/tmp/genesis-ffmpeg-venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /tmp/genesis-ffmpeg-bin/ffmpeg
            echo /tmp/genesis-ffmpeg-bin >> "$GITHUB_PATH"
          fi
      - name: Serve original sword and standalone V20 fire
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/genesis-v20-http.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/tests/fuego-v20/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/tests/fuego-v20/source_original_v03.glb)" = 200
      - name: Capture five real WebGL2 organic fire intensity animations
        run: |
          set -o pipefail
          node tests/fuego-v20/record.cjs | tee /tmp/genesis-v20-browser.log
          test "$(find fuego-v20-output -maxdepth 1 -name '*_frame_*.png' | wc -l)" -eq 120
          test "$(find fuego-v20-output -maxdepth 1 -name 'Proof_Fuego_*.png' | wc -l)" -eq 5
          test -s fuego-v20-output/audit.json
      - name: Encode five MP4s and three animation GIFs from captured frames
        run: |
          set -e
          cd fuego-v20-output
          for mode in Fuego_025 Fuego_050 Fuego_060 Fuego_075 Fuego_100; do
            ffmpeg -y -loglevel error -framerate 12 -i "$mode"_frame_%03d.png -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -movflags +faststart "$mode".mp4
            test -s "$mode".mp4
          done
          for mode in Fuego_025 Fuego_060 Fuego_100; do
            ffmpeg -y -loglevel error -i "$mode".mp4 -vf 'fps=10,scale=960:-1:flags=lanczos,palettegen' "$mode"_palette.png
            ffmpeg -y -loglevel error -i "$mode".mp4 -i "$mode"_palette.png -lavfi 'fps=10,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3' -loop 0 "$mode".gif
            test -s "$mode".gif
          done
      - name: Stage previews and audit only - exclude original GLB
        run: |
          set -e
          mkdir -p public-previews/fuego-v20-solo
          cp fuego-v20-output/*.mp4 public-previews/fuego-v20-solo/
          cp fuego-v20-output/*.gif public-previews/fuego-v20-solo/
          cp fuego-v20-output/Proof_*.png public-previews/fuego-v20-solo/
          cp fuego-v20-output/audit.json public-previews/fuego-v20-solo/
          test "$(find public-previews/fuego-v20-solo -maxdepth 1 -name '*.mp4' | wc -l)" -eq 5
          ! find public-previews/fuego-v20-solo -type f \( -iname '*.glb' -o -iname '*.exr' -o -iname '*.blend' \) | grep -q .
      - name: Preserve reviewer access to trial outputs
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V20-Fuego-Organic-Solo-Experimental
          path: public-previews/fuego-v20-solo/
          retention-days: 7
      - name: Publish experimental previews to V20 branch only
        run: |
          set -e
          git config user.name 'Genesis Studio Preview CI'
          git config user.email '41898282+genesis-preview[bot]@users.noreply.github.com'
          git fetch origin experiment/v20-fuego-individual-organico-superficie-20261106
          git checkout -B experiment/v20-fuego-individual-organico-superficie-20261106 FETCH_HEAD
          git add public-previews/fuego-v20-solo/
          if git diff --cached --quiet; then
            echo 'V20 previews already current'
          else
            git commit -m 'preview(v20): standalone organic thin fire PlayCanvas WebGL'
            git push origin HEAD:experiment/v20-fuego-individual-organico-superficie-20261106
          fi
      - name: Cleanup temporary source original
        if: always()
        run: rm -f /tmp/genesis-v20-original.glb tests/fuego-v20/source_original_v03.glb
