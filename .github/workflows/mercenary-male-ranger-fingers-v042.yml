name: Genesis | V042 official pre-rigged CC0 Male Ranger including actual weighted digits
on:
  push:
    branches: [experiment/mercenary-ranger-original-finger-rig-v042-20261107]
    paths:
      - scripts/mercenary/fetch_official_quaternius_knight_v041.cjs
      - scripts/mercenary/audit_actual_ranger_v042.py
      - .github/workflows/mercenary-male-ranger-fingers-v042.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-finger-rig-knight-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium for normal publisher-authorized $0 download flow
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Download legitimate original free Standard medieval outfits from Quaternius
        run: |
          set -euo pipefail
          node scripts/mercenary/fetch_official_quaternius_knight_v041.cjs
          test -s /tmp/genesis_v041/quaternius_fantasy_standard.zip
          unzip -tqq /tmp/genesis_v041/quaternius_fantasy_standard.zip
      - name: Audit pre-existing hand/finger joint bones, choose source medieval rig
        run: |
          set -euo pipefail
          python3 scripts/mercenary/audit_actual_ranger_v042.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/mercenary_ranger_v042/V042_ORIGINAL_MALE_RANGER_FINGER_QA.json')
          r=json.loads(p.read_text())
          assert r['status']=='ORIGINAL_FINGER_RIG_SKIN_QA_PASS'
          assert r['bone_count']==65 and r['finger_skinning_verified']
          assert r['left_weighted_vertices']>25 and r['right_weighted_vertices']>25
          assert len(r['left_finger_bone_names'])>=15 and len(r['right_finger_bone_names'])>=15
          print('V042_REAL_QUATERNIUS_MALE_RANGER_FINGER_SKIN_PASS',r['source_path'])
          PY
      - name: Upload only the qualified unmodified original model and report, no source ZIP or main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v042-authentic-ranger-65-joint-20-finger-chains
          path: output/mercenary_ranger_v042/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic screenshot only if free download page fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v042-official-itch-free-download-diagnostic
          path: /tmp/genesis_v041/itch_free_download_diagnostic.png
          if-no-files-found: ignore
          retention-days: 3
