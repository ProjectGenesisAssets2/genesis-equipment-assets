name: Genesis | DEMO V011 short real Blender walking animation GIF MP4
on:
  push:
    branches: [experiment/demo-sword-shield-v011-animated-review]
    paths:
      - scripts/mercenary/build_demo_sword_shield_clips_v010.py
      - scripts/mercenary/qa_demo_sword_shield_v011_motion_preview.py
      - scripts/mercenary/build_socket_rig_v004.py
      - scripts/mercenary/validate_native_sockets_v004.py
      - .github/workflows/mercenary-demo-sword-shield-motion-v011.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sockets:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate authentic original approved V12B geometry; do not publish source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis_original_v03_v175.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis_original_v03_v175.glb' | sha256sum -c
      - name: Download unaltered CC0 candidate rig and real HDRI 32-bit EXR
        run: |
          set -euo pipefail
          mkdir -p /tmp/mercenary_input
          curl -fSL --retry 4 --max-time 180 -A 'ProjectGenesis-Asset-Review/1.0' 'https://vibeassets.io/download/9h7odik5fl' -o /tmp/mercenary_input/meshy_captain_cc0.glb
          curl -fSL --retry 3 --max-time 240 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' -o /tmp/mercenary_input/studio_small_09_4k.exr
          echo 'bbb83755cf731a87373bdd25e28b4a74f58c8c8a02bf348e960635265ffda558  /tmp/mercenary_input/studio_small_09_4k.exr' | sha256sum -c
      - name: Inject real child-of-joint sockets into original animated GLB, preserving binary buffers
        run: |
          set -euo pipefail
          mkdir -p output/mercenary_motion_v011
          python3 scripts/mercenary/build_socket_rig_v004.py --source /tmp/mercenary_input/meshy_captain_cc0.glb --out output/mercenary_motion_v011
      - name: Check 10 animated clips against native GLB hand-joint hierarchy (not Blender importer)
        run: |
          set -euo pipefail
          python3 scripts/mercenary/validate_native_sockets_v004.py \
            --rig output/mercenary_motion_v011/mercenary_meshy_cc0_rig_sockets_v004.glb \
            --out output/mercenary_motion_v011/native_animated_sockets_v004.json
          test -s output/mercenary_motion_v011/native_animated_sockets_v004.json
      - name: Add two new idle/walk pose clips without modifying the original 10 animations
        run: |
          set -euo pipefail
          python3 scripts/mercenary/build_demo_sword_shield_clips_v010.py \
            --source output/mercenary_motion_v011/mercenary_meshy_cc0_rig_sockets_v004.glb \
            --out output/mercenary_motion_v011
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('output/mercenary_motion_v011/mercenary_sword_shield_idle_walk_v010.glb')
          b=p.read_bytes();n=struct.unpack_from('<I',b,12)[0]
          g=json.loads(b[20:20+n])
          assert len(g['animations'])==12 and len(g['skins'][0]['joints'])==24
          assert {a['name'] for a in g['animations'][-2:]}=={
            'GENESIS_SWORD_SHIELD_IDLE_V010','GENESIS_SWORD_SHIELD_WALK_V010'}
          print('V008 GLB with correct animations',len(b))
          PY
      - name: Install official Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 360 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender-4.5.13.tar.xz
          sudo mkdir -p /opt/genesis-blender
          sudo tar -xJf /tmp/blender-4.5.13.tar.xz -C /opt/genesis-blender --strip-components=1
          /opt/genesis-blender/blender --version | grep -F 'Blender 4.5.13'
      - name: QA actual skinned hands and approved V175 V12B sword; render Cycles HDRI32
        run: |
          set -euo pipefail
          /opt/genesis-blender/blender -b -t 4 --python-exit-code 1 --python scripts/mercenary/qa_demo_sword_shield_v011_motion_preview.py -- \
            --character output/mercenary_motion_v011/mercenary_sword_shield_idle_walk_v010.glb \
            --sword /tmp/genesis_original_v03_v175.glb \
            --hdri /tmp/mercenary_input/studio_small_09_4k.exr \
            --preset presets/approved/Genesis_Espada_V03_Hierro_V175_V12B.json \
            --out output/mercenary_motion_v011
          test -s output/mercenary_motion_v011/POSE_QA_V011.json
          test "$(find output/mercenary_motion_v011 -name '*.png' | wc -l)" -eq 12
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/mercenary_motion_v011')
          a=json.loads((p/'rig_integrity_v004.json').read_text())
          b=json.loads((p/'POSE_QA_V011.json').read_text())
          assert a['clip_count']==10 and a['skin_count']==1
          assert b['joint_count']==24
          assert b['max_left_foot_travel_m']>.07 or b['max_right_foot_travel_m']>.07
          assert b['no_placeholder_shield'] and not b['approved_shield_model_mounted']
          assert b['shield_hand_raised_vertical_m']>.065
          assert b['shield_hand_advanced_forward_m']>.12
          assert b['root_vertical_offset_m']==-.065
          assert len(b['foot_sole_world_min_samples'])==12
          assert b['real_rendered_animation_frames']==12
          assert b['sword_length_m']==.8925
          assert b['original_animations_intact']
          print('V008 BLENDER QA OK',b['shield_hand_raised_vertical_m'])
          PY
      - name: Assemble MP4 and animated GIF from 12 actual rendered Blender frames
        run: |
          set -euo pipefail
          OUT='output/mercenary_motion_v011'
          test "$(find "$OUT" -maxdepth 1 -name 'V011_WALK_*.png' | wc -l)" -eq 12
          ffmpeg -hide_banner -loglevel error -y -framerate 10 \
            -start_number 0 -i "$OUT/V011_WALK_%02d.png" \
            -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart \
            "$OUT/V011_marcha_espada_escudo_preview.mp4"
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('output/mercenary_motion_v011')
          frames=[]
          for p in sorted(root.glob('V011_WALK_*.png')):
              im=Image.open(p).convert('RGB')
              im.thumbnail((640,640),Image.Resampling.LANCZOS)
              frames.append(im.convert('P',palette=Image.Palette.ADAPTIVE,colors=192))
          assert len(frames)==12
          frames[0].save(root/'V011_marcha_espada_escudo_preview.gif',
            save_all=True,append_images=frames[1:],duration=100,
            loop=0,optimize=False,disposal=2)
          assert (root/'V011_marcha_espada_escudo_preview.gif').stat().st_size>100000
          assert (root/'V011_marcha_espada_escudo_preview.mp4').stat().st_size>100000
          print('REAL_CYCLES_ANIMATION_VIDEO_OK',len(frames))
          PY
      - name: Save verified review JPGs for user
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          mkdir -p reports/mercenary_motion_v011
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil
          src=Path('output/mercenary_motion_v011');out=Path('reports/mercenary_motion_v011')
          for p in sorted(src.glob('*.png')):
            image=Image.open(p).convert('RGB')
            image.thumbnail((1100,1400),Image.Resampling.LANCZOS)
            image.save(out/(p.stem+'.jpg'),quality=89,optimize=True)
          for name in ('rig_integrity_v004.json','POSE_QA_V011.json','native_animated_sockets_v004.json','demo_sword_shield_poses_v010.json'):
            shutil.copy2(src/name,out/name)
          assert len(list(out.glob('*.jpg')))==12
          PY
      - name: Commit small authentic QA previews only to experimental branch, never main
        run: |
          set -euo pipefail
          git config user.name 'genesis-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/mercenary_motion_v011
          git diff --cached --quiet || git commit -m 'QA actual real Blender renders: joint sockets and V12B sword only'
          git fetch origin experiment/demo-sword-shield-v011-animated-review
          git rebase FETCH_HEAD
          git push origin HEAD:experiment/demo-sword-shield-v011-animated-review
      - name: Upload clean sockets GLB, real PNGs and reports; licensed V12B source excluded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-mercenary-demo-sword-shield-motion-v011
          path: output/mercenary_motion_v011
          if-no-files-found: warn
          retention-days: 7
      - name: Erase protected sword source after run
        if: always()
        run: rm -f /tmp/genesis_original_v03_v175.glb
