name: Verify truly offline inline GLB viewer
on:
  push:
    branches: ['feature/genesis-sword-provisional-webgl-20261103']
    paths: ['tools/genesis-glb-viewer/build_inline_widget.py','tools/genesis-glb-viewer/inline-widget-template.html','.github/workflows/test-inline-widget.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build embedded viewer
        run: python3 tools/genesis-glb-viewer/build_inline_widget.py
      - run: |
          npm install --prefix /tmp/genesis-inline playwright@1.56.1
          /tmp/genesis-inline/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/genesis-inline/node_modules node tools/genesis-glb-viewer/test-inline.cjs
      - name: Commit verified offline page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/genesis-glb-viewer/inline-selfcontained.html
          git commit -m "viewer: publish Playwright-verified self-contained GLB viewer" || true
          git push origin HEAD:feature/genesis-sword-provisional-webgl-20261103
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: genesis-inline-glb-viewer-proven
          path: /tmp/genesis-inline-glb-proof.png
          retention-days: 7
