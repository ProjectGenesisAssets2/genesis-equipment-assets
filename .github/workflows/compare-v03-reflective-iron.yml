name: Genesis V03 — stronger iron metallic reflection with HDRI32
on:
  push:
    branches: [feature/fab-iron-sword-audit]
    paths: ['scripts/fab_sword/compare_v03_reflective_iron.py','.github/workflows/compare-v03-reflective-iron.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify intact original V03 sword
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-original-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-original-v03.glb' | sha256sum -c
      - name: Get real 32-bit EXR HDRI Studio Small 09
        run: |
          curl -fSL --retry 3 --max-time 240 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' -o /tmp/studio_small_09_4k.exr
          test $(stat -c %s /tmp/studio_small_09_4k.exr) -gt 1000000
      - name: Install Blender 4.5.13 LTS
        run: |
          curl -fSL --retry 3 --max-time 240 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender-4-5
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender-4-5 --strip-components=1
      - name: Render original baseline and two more reflective iron variants
        run: |
          mkdir -p /tmp/reflection-candidates
          /tmp/blender-4-5/blender -b -t 4 --factory-startup --python-exit-code 1 --python scripts/fab_sword/compare_v03_reflective_iron.py -- --input /tmp/genesis-original-v03.glb --hdri /tmp/studio_small_09_4k.exr --output-dir /tmp/reflection-candidates --samples 96
          test -s /tmp/reflection-candidates/C_reference_rawV175_originalMetal.png
          test -s /tmp/reflection-candidates/D_reflejo_metal_controlado.png
          test -s /tmp/reflection-candidates/E_reflejo_metal_intenso.png
      - name: Publish three renders and audit (never source GLB)
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V03-V175-Metal-Reflections
          path: /tmp/reflection-candidates/
          retention-days: 5
      - if: always()
        run: rm -f /tmp/genesis-original-v03.glb
