name: Genesis | V015 authentic Quaternius grounded medieval sword idle walk
on:
  push:
    branches: [experiment/mercenary-quaternius-v015-grounded-guard]
    paths:
      - scripts/mercenary/retarget_quaternius_grounded_v015.py
      - scripts/mercenary/qa_quaternius_grounded_v015.py
      - .github/workflows/mercenary-quaternius-grounded-v015.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authentic original V12B sword solely for protected Cycles QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py \
            --manifest render-input/v03-blob-manifest.json \
            --output /tmp/genesis_v12b_original_protected.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis_v12b_original_protected.glb' | sha256sum -c
      - name: Download CC0 Quaternius real animation GLB, original mercenary and 32bit EXR
        run: |
          set -euo pipefail
          mkdir -p /tmp/genesis-quaternius-v012 output/mercenary_quaternius_v015
          curl -fSL --retry 4 --max-time 180 \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/universal-animation-library.glb' \
            -o /tmp/genesis-quaternius-v012/Quaternius_CC0_Universal_Animations.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  /tmp/genesis-quaternius-v012/Quaternius_CC0_Universal_Animations.glb' | sha256sum -c
          curl -fSL --retry 4 --max-time 180 -A 'ProjectGenesis-Asset-Review/1.0' \
            'https://vibeassets.io/download/9h7odik5fl' \
            -o /tmp/genesis-quaternius-v012/meshy_cc0_original.glb
          curl -fSL --retry 3 --max-time 240 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' \
            -o /tmp/genesis-quaternius-v012/studio_small_09_4k.exr
          echo 'bbb83755cf731a87373bdd25e28b4a74f58c8c8a02bf348e960635265ffda558  /tmp/genesis-quaternius-v012/studio_small_09_4k.exr' | sha256sum -c
      - name: Reconstruct exact verified native Genesis hand sockets before retarget
        run: |
          set -euo pipefail
          python3 scripts/mercenary/build_socket_rig_v004.py \
            --source /tmp/genesis-quaternius-v012/meshy_cc0_original.glb \
            --out /tmp/genesis-quaternius-v012
          echo '39abc0750132e4ac2056dc8227269d4e769599b5dea743ea95faf6a5e27110f8  /tmp/genesis-quaternius-v012/mercenary_meshy_cc0_rig_sockets_v004.glb' | sha256sum -c
          python3 scripts/mercenary/validate_native_sockets_v004.py \
            --rig /tmp/genesis-quaternius-v012/mercenary_meshy_cc0_rig_sockets_v004.glb \
            --out /tmp/genesis-quaternius-v012/native_sockets_qa.json
      - name: Retarget actual authored CC0 Sword Idle Walk Sword Attack Jog to original Genesis mercenary
        run: |
          set -euo pipefail
          python3 scripts/mercenary/retarget_quaternius_grounded_v015.py \
            --character /tmp/genesis-quaternius-v012/mercenary_meshy_cc0_rig_sockets_v004.glb \
            --source /tmp/genesis-quaternius-v012/Quaternius_CC0_Universal_Animations.glb \
            --out output/mercenary_quaternius_v015
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('output/mercenary_quaternius_v015/RETARGET_QA_V015.json').read_text())
          assert q['total_animations']==15
          assert q['new_quaternius_clips']==5
          assert q['author_reference_clip']=='A_TPose'
          assert q['dynamic_toe_grounding']
          assert all(c['toe_toe_dynamic_grounding'] for c in q['clips'])
          assert q['max_reference_calibration_angle_deg']>=0.
          assert q['mercenary_bones']==24 and q['source_quaternius_bones']==65
          assert q['mesh_skin_material_and_original_animation_bytes_unchanged']
          for x in q['clips']:
            assert x['animated_target_rotations']==22
          print('GENESIS_CC0_QUATERNIUS_V015_RETARGET_VERIFIED',q['retargeted_glb_sha256'])
          PY
      - name: Install official Blender 4.5.13 LTS to verify real rig and PBR metal
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 360 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.13.tar.xz
          sudo mkdir -p /opt/genesis-blender
          sudo tar -xJf /tmp/blender-4.5.13.tar.xz -C /opt/genesis-blender --strip-components=1
          /opt/genesis-blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Six real Cycles 32bit EXR sword stances and walk / attack animation poses
        run: |
          set -euo pipefail
          /opt/genesis-blender/blender -b -t 4 --python-exit-code 1 \
            --python scripts/mercenary/qa_quaternius_grounded_v015.py -- \
            --character output/mercenary_quaternius_v015/mercenary_quaternius_cc0_grounded_guard_v015.glb \
            --sword /tmp/genesis_v12b_original_protected.glb \
            --hdri /tmp/genesis-quaternius-v012/studio_small_09_4k.exr \
            --preset presets/approved/Genesis_Espada_V03_Hierro_V175_V12B.json \
            --out output/mercenary_quaternius_v015
          test -s output/mercenary_quaternius_v015/POSE_QA_CC0_V015.json
          test "$(find output/mercenary_quaternius_v015 -maxdepth 1 -name '*.png' | wc -l)" -eq 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/mercenary_quaternius_v015/POSE_QA_CC0_V015.json')
          q=json.loads(p.read_text())
          assert q['total_actions']>=15
          assert len(q['renders'])==3
          assert q['sword_attached_to_real_bone_socket']
          assert q['no_placeholder_shield']
          assert q['sword_length_m']==.8925
          print('GENESIS_REAL_CC0_V015_CYCLES_QA_PASS',len(q['renders']))
          PY
      - name: Create small thumbnail reviews and retain full PNG / GLB in Action artifacts only
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          mkdir -p reports/mercenary_quaternius_v015
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          source=Path('output/mercenary_quaternius_v015')
          target=Path('reports/mercenary_quaternius_v015')
          for image in source.glob('*.png'):
              im=Image.open(image).convert('RGB')
              im.thumbnail((800,1000),Image.Resampling.LANCZOS)
              im.save(target/(image.stem+'.jpg'),quality=87,optimize=True)
          for name in ['RETARGET_QA_V015.json','POSE_QA_CC0_V015.json']:
              shutil.copy2(source/name,target/name)
          assert len(list(target.glob('*.jpg')))==3
          PY
      - name: Commit only visual QA and reports to experimental branch
        run: |
          set -euo pipefail
          git config user.name 'genesis-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/mercenary_quaternius_v015
          git diff --cached --quiet || git commit -m 'V012 review: authentic retargeted Quaternius CC0 sword animations, 6 Blender Cycles renders'
          git fetch origin experiment/mercenary-quaternius-v015-grounded-guard
          git rebase FETCH_HEAD
          git push origin HEAD:experiment/mercenary-quaternius-v015-grounded-guard
      - name: Upload source-independent retargeted GLB and true Blender renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-mercenary-v015-real-cc0-grounded-sword-guard
          path: output/mercenary_quaternius_v015
          if-no-files-found: warn
          retention-days: 7
      - name: Erase licensed original sword source
        if: always()
        run: rm -f /tmp/genesis_v12b_original_protected.glb
