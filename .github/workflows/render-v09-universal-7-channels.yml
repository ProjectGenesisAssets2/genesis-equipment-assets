name: Genesis V09 - 7 universal elemental shaders sword and shield contour
on:
  push:
    branches: [experiment/v09-universal-7-channels-sword-shield-20261105]
    paths:
      - 'vfx/**'
      - 'tests/universal-v09/**'
      - '.github/workflows/render-v09-universal-7-channels.yml'
  workflow_dispatch:
concurrency:
  group: genesis-v09-universal-7
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved Rayo V07 shader unchanged
        run: python3 tests/fire-rayo-v08/check_rayo_approved.py
      - name: Check inventory channel semantics and intensity clamps
        run: node tests/universal-v09/validate-bridge.mjs
      - name: Recover exact original sword V03; verify unchanged SHA256
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-original-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-original-v03.glb' | sha256sum -c
          cp /tmp/genesis-original-v03.glb tests/universal-v09/source_original_v03.glb
      - name: Install real PlayCanvas and Chromium
        run: |
          npm install --no-audit --no-fund --no-save playcanvas@2.23.3 playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Serve original sword and computed shield silhouette harness
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/genesis-v09-server.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/tests/universal-v09/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/tests/universal-v09/source_original_v03.glb)" = 200
      - name: Render 7 channels on 2 shapes with intensity endpoints and report visible coverage
        run: |
          set -o pipefail
          node tests/universal-v09/record.cjs | tee /tmp/genesis-v09-render.log
          test "$(find universal-v09-output -maxdepth 1 -name '*_060.png' | wc -l)" -eq 7
          test -s universal-v09-output/Fuego060_Rayo070_BothTargets.png
          test -s universal-v09-output/audit.json
      - name: Copy experimental proof and audit (no source GLB)
        run: |
          mkdir -p public-previews/universal-v09
          cp universal-v09-output/*.png public-previews/universal-v09/
          cp universal-v09-output/audit.json public-previews/universal-v09/
          ! find public-previews/universal-v09 -type f -iname '*.glb' | grep -q .
      - name: Upload experimental results for visual assessment
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V09-Seven-Channels-Sword-ShieldFixture-RealWebGL2
          path: public-previews/universal-v09/
          retention-days: 7
      - name: Publish experimental proofs without modifying main
        run: |
          git config user.name 'Genesis Preview CI'
          git config user.email '41898282+genesis-preview[bot]@users.noreply.github.com'
          git add public-previews/universal-v09/
          if git diff --cached --quiet; then echo 'Preview unchanged'; else
            git commit -m 'preview(v09): seven channels on real V03 and mesh-derived shield silhouette'
            git push origin HEAD:experiment/v09-universal-7-channels-sword-shield-20261105
          fi
      - name: Cleanup licensed original
        if: always()
        run: rm -f /tmp/genesis-original-v03.glb tests/universal-v09/source_original_v03.glb
