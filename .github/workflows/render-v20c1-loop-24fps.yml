name: Genesis V20C.1 - bucle de fuego suave 24 FPS sin editar shader
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [experiment/v20c-calor-metal-flamas-organicas-20261106]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-v20c1-loop-24fps
  cancel-in-progress: true
jobs:
  loop-playcanvas-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact V20C fire shader and capture scripts
        run: |
          node --check tests/fuego-v20c1/scene.js
          node --check tests/fuego-v20c1/record.cjs
          node --check tests/fuego-v20c1/stitch_loop.cjs
          node --check vfx/experimental/Genesis_Fuego_V20C_CalorYFlamas.mjs
          node tests/affinity-slots-v01/validate.mjs
          python3 tests/fire-rayo-v08/check_rayo_approved.py
          test "$(git hash-object vfx/experimental/Genesis_Fuego_V20C_CalorYFlamas.mjs)" = fc4a3722e7c07b33d034b6d1ead5504f480a6345
      - name: Restore unchanged sword V03 GLB (temporary)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-v20c1-original.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-v20c1-original.glb' | sha256sum -c
          cp /tmp/genesis-v20c1-original.glb tests/fuego-v20c1/source_original_v03.glb
      - name: Install WebGL2 PlayCanvas, Chromium and FFmpeg
        timeout-minutes: 6
        run: |
          timeout 180s npm install --no-audit --no-fund --no-save playcanvas@2.23.3 playwright@1.56.1 pngjs@7.0.0
          timeout 120s npx playwright install chromium --only-shell
          if ! command -v ffmpeg >/dev/null; then
            python3 -m venv /tmp/genesis-ffmpeg-venv
            /tmp/genesis-ffmpeg-venv/bin/pip install --disable-pip-version-check --quiet imageio-ffmpeg==0.6.0
            mkdir -p /tmp/genesis-ffmpeg-bin
            ln -s "$(/tmp/genesis-ffmpeg-venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /tmp/genesis-ffmpeg-bin/ffmpeg
            echo /tmp/genesis-ffmpeg-bin >> "$GITHUB_PATH"
          fi
      - name: Serve original GLB and unchanged V20C shader
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/genesis-v20c1-server.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/tests/fuego-v20c1/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/tests/fuego-v20c1/source_original_v03.glb)" = 200
      - name: Capture 168 original frames from PlayCanvas WebGL2, 24 fps
        timeout-minutes: 20
        run: |
          set -o pipefail
          node tests/fuego-v20c1/record.cjs | tee /tmp/genesis-v20c1-browser.log
          test "$(find fuego-v20c1-output -maxdepth 1 -name '*_source_frame_*.png' | wc -l)" -eq 168
          test -s fuego-v20c1-output/capture_audit.json
      - name: Stitch natural-seam loops and inspect seam discontinuity
        timeout-minutes: 6
        run: |
          node tests/fuego-v20c1/stitch_loop.cjs
          test "$(find fuego-v20c1-output -maxdepth 1 -name '*_loop_frame_*.png' | wc -l)" -eq 144
          test -s fuego-v20c1-output/audit.json
      - name: Encode genuine 24 fps seamless MP4 and GIF
        timeout-minutes: 8
        run: |
          set -e
          cd fuego-v20c1-output
          for mode in Fuego_060 Fuego_100; do
            ffmpeg -y -loglevel error -framerate 24 -i "$mode"_loop_frame_%03d.png -c:v libx264 -crf 17 -preset medium -pix_fmt yuv420p -movflags +faststart "$mode"_24fps_loop.mp4
            test -s "$mode"_24fps_loop.mp4
            ffmpeg -y -loglevel error -framerate 24 -i "$mode"_loop_frame_%03d.png -vf 'fps=24,scale=960:-1:flags=lanczos,palettegen' "$mode"_loop_palette.png
            ffmpeg -y -loglevel error -framerate 24 -i "$mode"_loop_frame_%03d.png -i "$mode"_loop_palette.png -lavfi 'fps=24,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3' -loop 0 "$mode"_24fps_loop.gif
            test -s "$mode"_24fps_loop.gif
          done
      - name: Copy only videos and previews to experimental branch
        run: |
          set -e
          mkdir -p public-previews/fuego-v20c1-loop24
          cp fuego-v20c1-output/*.mp4 public-previews/fuego-v20c1-loop24/
          cp fuego-v20c1-output/*.gif public-previews/fuego-v20c1-loop24/
          cp fuego-v20c1-output/Proof_*.png public-previews/fuego-v20c1-loop24/
          cp fuego-v20c1-output/audit.json public-previews/fuego-v20c1-loop24/
          test "$(find public-previews/fuego-v20c1-loop24 -maxdepth 1 -name '*.mp4' | wc -l)" -eq 2
          test "$(find public-previews/fuego-v20c1-loop24 -maxdepth 1 -name '*.gif' | wc -l)" -eq 2
          ! find public-previews/fuego-v20c1-loop24 -type f \( -iname '*.glb' -o -iname '*.exr' -o -iname '*.blend' \) | grep -q .
      - name: Keep downloadable results as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V20C1-24fps-Loop-ReviewOnly
          path: public-previews/fuego-v20c1-loop24/
          retention-days: 7
      - name: Publish previews to V20C.1 only, never main
        run: |
          set -e
          git config user.name 'Genesis Preview CI'
          git config user.email '41898282+genesis-preview[bot]@users.noreply.github.com'
          git fetch origin experiment/v20c1-animacion-24fps-loop-perfecto-20261106
          git checkout -B experiment/v20c1-animacion-24fps-loop-perfecto-20261106 FETCH_HEAD
          git add public-previews/fuego-v20c1-loop24/
          if git diff --cached --quiet; then
            echo 'Preview identical'
          else
            git commit -m 'preview(v20c1): real 24fps WebGL flame with continuous GIF/MP4 loop'
            git push origin HEAD:experiment/v20c1-animacion-24fps-loop-perfecto-20261106
          fi
      - name: Remove temporary original licensed GLB
        if: always()
        run: rm -f /tmp/genesis-v20c1-original.glb tests/fuego-v20c1/source_original_v03.glb
