name: Blender Cycles — Original V03 with actual 32-bit HDRI studio
on:
  push:
    branches: [feature/fab-iron-sword-audit]
    paths: ['scripts/fab_sword/render_v03_real_hdri32.py','.github/workflows/render-v03-original-hdri32.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact 21.28MB GLB from verified repository blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-v03.glb' | sha256sum -c
      - name: Download authentic Poly Haven Studio Small 09 EXR studio HDRI
        run: |
          curl -fSL --retry 3 --connect-timeout 25 --max-time 220 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' -o /tmp/studio_small_09_4k.exr
          test $(stat -c %s /tmp/studio_small_09_4k.exr) -gt 1000000
          sha256sum /tmp/studio_small_09_4k.exr
      - name: Install official Blender 4.5.13 LTS for Linux
        run: |
          curl -fSL --retry 3 --max-time 240 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/genesis-blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/genesis-blender --strip-components=1
          /tmp/genesis-blender/blender --version | head -2
      - name: Render untouched source sword, original PBR textures, real EXR HDRI in Cycles
        run: |
          mkdir -p /tmp/genesis-render
          /tmp/genesis-blender/blender -b -t 4 --factory-startup --python-exit-code 1 --python scripts/fab_sword/render_v03_real_hdri32.py -- --input /tmp/genesis-v03.glb --hdri /tmp/studio_small_09_4k.exr --output-dir /tmp/genesis-render --samples 96
          test -s /tmp/genesis-render/V03_Blender_Cycles_HDRI32_Hero.png
          test -s /tmp/genesis-render/V03_Blender_Cycles_HDRI32_TresCuartos.png
          test -s /tmp/genesis-render/render_audit.json
      - name: Publish renders and audit only, never the licensed source
        uses: actions/upload-artifact@v4
        with:
          name: V03-Blender-Cycles-RealStudioSmall09-EXR
          path: /tmp/genesis-render/
          retention-days: 5
      - if: always()
        run: rm -f /tmp/genesis-v03.glb
