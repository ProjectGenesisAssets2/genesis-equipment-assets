name: Genesis V03 — oxidized V175 rose iron, original ridge, HDRI32 Cycles
on:
  push:
    branches: [feature/fab-iron-sword-audit]
    paths: ['scripts/fab_sword/compare_v03_rose_iron.py','.github/workflows/compare-v03-rose-iron.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstitute exact original GLB privately and verify integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fab_sword/hydrate_git_blobs_v03.py --manifest render-input/v03-blob-manifest.json --output /tmp/genesis-original-v03.glb
          echo 'e2228f078b2572768416c48c0e63c2d908f214e2c0625a2ab754c877a099112b  /tmp/genesis-original-v03.glb' | sha256sum -c
      - name: Download original Poly Haven Studio Small 09 4K 32-bit EXR
        run: |
          curl -fSL --retry 3 --max-time 240 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/studio_small_09_4k.exr' -o /tmp/studio_small_09_4k.exr
          test $(stat -c %s /tmp/studio_small_09_4k.exr) -gt 1000000
      - name: Install official Blender 4.5.13 LTS
        run: |
          curl -fSL --retry 3 --max-time 240 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender-4-5
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender-4-5 --strip-components=1
      - name: Cycles compare four levels of V175 oxide coloration with same camera and light
        run: |
          mkdir -p /tmp/v175-rose-iron
          /tmp/blender-4-5/blender -b -t 4 --factory-startup --python-exit-code 1 --python scripts/fab_sword/compare_v03_rose_iron.py -- --input /tmp/genesis-original-v03.glb --hdri /tmp/studio_small_09_4k.exr --output-dir /tmp/v175-rose-iron --samples 80
          for f in A_gris_hierro_ref B_vetas_rosadas_sutiles C_vetas_rosadas_naturales D_oxidacion_marcada; do test -s "/tmp/v175-rose-iron/$f.png"; done
          test -s /tmp/v175-rose-iron/render_audit.json
      - name: Publish rendered previews and audit, not licensed GLB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-V03-V175-Rose-Iron-Compare
          path: /tmp/v175-rose-iron/
          retention-days: 5
      - if: always()
        run: rm -f /tmp/genesis-original-v03.glb
